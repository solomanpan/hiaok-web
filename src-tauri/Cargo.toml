[package]
name = "hiaok-web"
version = "1.0.0"
description = "hiaok permission center"
edition = "2021"
license = "MIT"

[lib]
name = "hiaok_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
